<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 12px;
        width: 280px;
        color: #e7ecf1;
        background: #0f1419;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
        color: #3dd6c6;
      }
      button {
        width: 100%;
        margin: 4px 0;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: #3dd6c6;
        color: #04221f;
        font-weight: 650;
        cursor: pointer;
      }
      button.secondary {
        background: #1a222c;
        color: #e7ecf1;
        border: 1px solid #2a3542;
      }
      .muted {
        color: #8b9aab;
        font-size: 11px;
        margin-top: 8px;
      }
      code {
        font-size: 11px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>mailnotmilk</h1>
    <div id="status" class="muted">connecting…</div>
    <button id="useTab">Use this tab</button>
    <button id="refresh" class="secondary">Refresh status</button>
    <p class="muted">
      Open Chrome normally (no flags). Keep this extension enabled. Run
      <code>./run.sh</code> — it drives whatever AI site is in your tabs.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
